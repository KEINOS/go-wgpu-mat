version: "2"
linters:
  default: all
  settings:
    varnamelen:
      ignore-names:
        - "ctx"
    gomoddirectives:
      # gogpu/wgpu is temporarily replaced by the KEINOS/wgpu fork branch
      # carrying the _mslBufferSizes Metal fix until upstream merges it
      # (see .agents/decisions.md D-009).
      replace-allow-list:
        - github.com/gogpu/wgpu
  disable:
    - wsl
    - testpackage
    - depguard
    - gomodguard
